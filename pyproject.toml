[project]
name = "med-guard-rag"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "azure-monitor-opentelemetry>=1.8.9",
    "fastapi>=0.139.0",
    "fastembed>=0.8.0",
    "httpx2>=2.5.0",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.45.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "pydantic-settings>=2.14.2",
    "qdrant-client>=1.18.0",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
eval = [
    "datasets>=5.0.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "ragas>=0.4.3",
    "scikit-learn>=1.9.0",
]
nli = [
    "protobuf>=7.35.1",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.uv]
default-groups = ["nli"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff.lint]
ignore = ["E501"]  # line length

[tool.pytest.ini_options]
pythonpath = ["."]
