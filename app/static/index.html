<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MedGuard</title>
<style>
  :root { --bg:#f7f9fb; --card:#fff; --ink:#1f2933; --muted:#6b7280; --accent:#0f766e; --line:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:48px 20px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  textarea { width:100%; border:1px solid var(--line); border-radius:10px; padding:12px;
             font:inherit; resize:vertical; min-height:70px; }
  button { margin-top:12px; background:var(--accent); color:#fff; border:0; border-radius:10px;
           padding:11px 18px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .hint { color:var(--muted); font-size:.85rem; margin-top:10px; }
  #out { margin-top:24px; }
  .answer { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent);
            border-radius:10px; padding:18px; }
  .answer.abstain { border-left-color:#b45309; }
  .badge { display:inline-block; font-size:.75rem; color:var(--muted);
           border:1px solid var(--line); border-radius:999px; padding:2px 10px; margin-bottom:10px; }
  .cites { margin-top:16px; }
  .cites h4 { margin:0 0 8px; font-size:.85rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .cite { font-size:.9rem; margin:6px 0; }
  .cite a { color:var(--accent); text-decoration:none; }
  .cite a:hover { text-decoration:underline; }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid #fff; border-top-color:transparent;
             border-radius:50%; animation:spin .7s linear infinite; vertical-align:-3px; margin-right:8px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>MedGuard</h1>
    <p class="sub">Evidence-grounded answers from medical literature — with citations, or an honest "I don't know."</p>
    <div class="card">
      <textarea id="q" placeholder="e.g. Does type 1 diabetes affect Achilles tendon response to running?"></textarea>
      <button id="ask">Ask</button>
      <div class="hint">First question may take ~30s while the model warms up.</div>
    </div>
    <div id="out"></div>
  </div>
<script>
const btn = document.getElementById('ask');
const q   = document.getElementById('q');
const out = document.getElementById('out');

async function ask() {
  const query = q.value.trim();
  if (!query) return;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Thinking…';
  out.innerHTML = '';
  try {
    const r = await fetch('/ask', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ query })
    });
    const d = await r.json();
    render(d);
  } catch (e) {
    out.innerHTML = '<div class="answer abstain">Something went wrong. Please try again.</div>';
  } finally {
    btn.disabled = false; btn.textContent = 'Ask';
  }
}

function render(d) {
  const abstained = d.abstained;
  const conf = (d.confidence != null) ? ` · confidence ${Math.round(d.confidence*100)}%` : '';
  let cites = '';
  if (d.citations && d.citations.length) {
    cites = '<div class="cites"><h4>Sources</h4>' +
      d.citations.map(c =>
        `<div class="cite">[${c.citation}] <a href="${c.url}" target="_blank" rel="noopener">${c.title}</a></div>`
      ).join('') + '</div>';
  }
  out.innerHTML =
    `<div class="answer${abstained ? ' abstain' : ''}">
       <div class="badge">${abstained ? 'Abstained' : 'Answered'}${abstained ? '' : conf}</div>
       <div>${d.answer}</div>
       ${abstained ? '' : cites}
     </div>`;
}

btn.addEventListener('click', ask);
q.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) ask(); });
</script>
</body>
</html>
